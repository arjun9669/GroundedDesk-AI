name: GroundedDesk CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.mjs
          node --check retrieval.mjs
          node --check hybrid.mjs
          node --check semantic.mjs
          node --check generation.mjs
          node --check research.mjs
          node --check policy-synthesis.mjs
          node --check quality.mjs
          node --check benchmark.mjs
          node --check report.mjs
          node --check provenance.mjs
          node --check pdf-preview.mjs
          node --check pdf-ingest.mjs
          node --check pdf-highlight.mjs
          node --check workspace-ui.mjs
          node --check eval/run.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Offline labeled corpus evaluation
        run: |
          node eval/run.mjs --strict
          node eval/run.mjs --json > evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: groundeddesk-evaluation
          path: evaluation.json
          retention-days: 14

  browser-smoke:
    name: Browser UI smoke (synthetic text and PDF)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser-test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pdfjs-dist@4.10.38
          npx playwright install --with-deps chromium
      - name: Exercise Q&A, Research and Comparison in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/browser-policy-smoke.mjs
          node tests/browser-pdf-smoke.mjs
          node tests/browser-research-pages-smoke.mjs
          node tests/browser-pdf-reliability.mjs
          node tests/browser-pdf-highlight.mjs
          node tests/browser-workspace-ui.mjs
          node tests/browser-document-library.mjs
